name: XDNA1 report / Reporte XDNA1
description: A measurement or a failure from your first-generation NPU (Ryzen 7040, 8040, 8000G) / Una medición o un fallo de tu NPU de primera generación
labels: ["xdna1-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Failures help as much as successes. Do not paste tokens, keys or personal paths. / Gracias. Los fallos sirven tanto como los éxitos. No pegues tokens, claves ni rutas personales.
  - type: input
    id: cpu
    attributes:
      label: CPU / NPU
      placeholder: Ryzen 7 7840HS (Phoenix) / Ryzen 5 8645HS (Hawk Point)
    validations: {required: true}
  - type: input
    id: versions
    attributes:
      label: Kernel, amdxdna driver, firmware, XRT
      placeholder: "7.2.10, amdxdna 0.6, fw 1.5.5.391, XRT 2.21.75"
    validations: {required: true}
  - type: textarea
    id: output
    attributes:
      label: Output of `python bench/watch.py` (or the error)
      render: text
    validations: {required: true}
  - type: textarea
    id: extra
    attributes:
      label: Anything else (power profile, on battery or plugged in, model used) / Algo más
